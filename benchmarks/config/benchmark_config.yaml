# OCTO-AGI Benchmark Configuration

general:
  # Output settings
  output_directory: "benchmarks/results"
  save_visualizations: true
  visualization_format: "png"
  
  # Execution mode: "quick" or "comprehensive"
  mode: "comprehensive"
  
  # Number of iterations for averaging results
  quick_iterations: 10
  comprehensive_iterations: 100
  
  # Enable detailed profiling
  enable_profiling: true
  
  # Random seed for reproducibility
  random_seed: 42

# Performance thresholds and targets
performance_thresholds:
  
  # UMG Reasoning thresholds
  umg_reasoning:
    graph_traversal:
      max_time_ms_small: 10      # 100 nodes
      max_time_ms_medium: 100    # 1,000 nodes
      max_time_ms_large: 1000    # 10,000 nodes
      max_memory_mb: 50
    
    reasoning_depth:
      min_accuracy_percent: 90
      max_time_per_inference_ms: 200
      min_reasoning_steps: 3
    
    memory_efficiency:
      max_memory_per_100_nodes_mb: 1
      max_memory_growth_rate: 1.2  # Linear scaling factor

  # Tetrahedral Spatial thresholds
  tetrahedral_spatial:
    spatial_processing:
      max_time_ms: 50              # For 1000 points
      min_accuracy_percent: 95
      min_throughput_ops_sec: 1000
    
    multidimensional_mapping:
      max_time_ms: 100
      min_relationship_accuracy_percent: 90
      max_mapping_error: 0.01
    
    geometric_inference:
      max_time_ms: 150
      min_spatial_reasoning_accuracy_percent: 85
      min_shape_recognition_accuracy: 0.90

  # Deschooling Learning thresholds
  deschooling_learning:
    learning_adaptation:
      min_adaptation_rate_percent: 80
      max_adaptation_time_ms: 500
      min_flexibility_score: 0.75
    
    knowledge_retention:
      min_short_term_retention_percent: 95   # 100 iterations
      min_medium_term_retention_percent: 90  # 1,000 iterations
      min_long_term_retention_percent: 85    # 10,000 iterations
      max_decay_rate: 0.15
    
    creative_problem_solving:
      min_solutions_per_problem: 3
      min_novelty_score: 0.70
      min_quality_score: 0.80

  # Unified Consciousness thresholds
  unified_consciousness:
    cross_system_coherence:
      min_coherence_score_percent: 95
      min_consistency_score: 0.90
      max_coherence_time_ms: 100
    
    integration_latency:
      max_overhead_ms: 20
      max_throughput_degradation_percent: 10
      max_latency_variance_ms: 5
    
    emergent_behavior:
      min_novel_behaviors: 1
      min_behavior_quality_score: 0.75
      track_emergence_frequency: true

# Test parameters
test_parameters:
  
  umg_reasoning:
    graph_sizes: [100, 1000, 10000]
    max_connections_per_node: 10
    reasoning_chain_lengths: [3, 10, 20]
    
  tetrahedral_spatial:
    point_cloud_sizes: [100, 1000, 5000]
    dimensions: [2, 3, 4]
    geometric_shapes: ["cube", "sphere", "pyramid", "complex"]
    
  deschooling_learning:
    learning_iterations: [100, 1000, 10000]
    problem_complexity_levels: ["simple", "medium", "complex"]
    adaptation_scenarios: 5
    
  unified_consciousness:
    integration_levels: ["minimal", "standard", "full"]
    system_combinations: [
      ["umg", "spatial"],
      ["umg", "learning"],
      ["spatial", "learning"],
      ["umg", "spatial", "learning"]
    ]
    emergence_test_duration_seconds: 60

# Output formats
output:
  # Generate JSON report
  json_report: true
  json_indent: 2
  
  # Generate Markdown report
  markdown_report: true
  include_graphs_in_markdown: true
  
  # Generate CSV for data analysis
  csv_export: true
  
  # Console output verbosity: "silent", "normal", "verbose"
  console_verbosity: "normal"
  
  # Save individual benchmark results
  save_individual_results: true
  
  # Historical tracking
  track_history: true
  history_file: "benchmarks/results/history.json"

# Profiling settings
profiling:
  # CPU profiling
  enable_cpu_profiling: true
  cpu_sample_rate_ms: 10
  
  # Memory profiling
  enable_memory_profiling: true
  memory_sample_rate_ms: 50
  track_memory_allocations: true
  
  # I/O profiling
  enable_io_profiling: false
  
  # Generate flame graphs
  generate_flame_graphs: false

# Visualization settings
visualization:
  # Chart types to generate
  generate_time_series: true
  generate_bar_charts: true
  generate_heat_maps: true
  generate_comparison_charts: true
  
  # Chart styling
  chart_style: "seaborn"
  figure_size: [12, 8]
  dpi: 100
  
  # Color scheme
  color_scheme: "viridis"

# Advanced settings
advanced:
  # Warmup iterations before actual benchmarking
  warmup_iterations: 5
  
  # Statistical confidence
  confidence_level: 0.95
  
  # Outlier detection and removal
  remove_outliers: true
  outlier_threshold_std: 3.0
  
  # Parallel execution
  enable_parallel: false
  max_workers: 4
  
  # Timeout settings
  benchmark_timeout_seconds: 300
  individual_test_timeout_seconds: 60
